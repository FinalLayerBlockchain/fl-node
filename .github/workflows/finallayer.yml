name: Final Layer
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build geth and flpq
        run: go build ./cmd/geth ./cmd/flpq
      - name: Final Layer tests
        run: bash build/finallayer/test.sh
